title: Mimikatz Indicators
id: b3f1c9a2-4d7e-4a1b-9c2d-8e6f5a4b3c2d
status: experimental
description: Detects command lines and process indicators associated with Mimikatz credential dumping.
author: Arun Kumar Velusamy
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\mimikatz.exe'
  selection_cli:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'sekurlsa::wdigest'
      - 'lsadump::sam'
      - 'privilege::debug'
  condition: selection_img or selection_cli
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
falsepositives:
  - Red team exercises and authorised penetration tests
