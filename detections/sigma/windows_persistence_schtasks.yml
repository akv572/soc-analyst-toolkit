title: Suspicious Scheduled Task Creation
id: c7a2e1b4-9f3d-4c8a-b5e6-2d4f7a9b1c3e
status: experimental
description: Detects scheduled task creation with patterns commonly used for persistence.
author: Arun Kumar Velusamy
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
      - '/create'
  filter_legit_admin:
    # Tune: allow your patching and software deployment accounts here
    User|contains:
      - 'SYSTEM'
  suspicious_args:
    CommandLine|contains:
      - 'powershell'
      - 'cmd.exe'
      - 'wscript'
      - 'mshta'
      - 'http'
  condition: selection and suspicious_args and not filter_legit_admin
level: high
tags:
  - attack.persistence
  - attack.t1053.005
falsepositives:
  - Software deployment tools creating tasks that launch scripts
